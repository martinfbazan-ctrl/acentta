<!-- El dibujo es el que exportaste. Lo único que cambió es el
     encuadre, y por un motivo concreto: el lienzo venía 160×197,
     rectangular, y la pestaña del navegador es un cuadrado de 16 px.
     Un SVG más alto que ancho se encaja adentro dejando franjas
     vacías arriba y abajo, y encima el trazo sólo ocupaba de 33 a 127
     de los 160 de ancho: más aire muerto a los costados.
     Entre las dos cosas, la «a» se dibujaba a menos de 8 px.

     El viewBox de abajo recorta al contenido real y lo cuadra con un
     margen parejo. Mismos trazos, mismas coordenadas, ninguna ruta
     tocada — sólo la ventana por la que se los mira. -->
