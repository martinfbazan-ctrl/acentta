descripcion: >-
  Tu vaso favorito para beber sobre la marcha ahora viene en tamaño XL. El Cold
  Cup XL es tu compañero ideal para esos días en los que decides tomar la ruta
  larga. Con una capacidad de 30 onzas, un asa ergonómica y la misma tapa
  central con pajita a prueba de derrames que ya conoces y adoras, este vaso
  elegante —diseñado para caber en los portavasos— está hecho para aguantar el
  ritmo y lucir genial mientras lo hace.
