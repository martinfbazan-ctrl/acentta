descripcion: >-
  En Argentina, el mate es mucho más que una bebida: es parte de nuestra cultura
  y de cada momento compartido. Con el Stanley Mate System Classic de 1,2
  litros, podés disfrutarlo estés donde estés.


  Su tapón de alta precisión permite cebar de manera cómoda, continua y
  controlada, mientras que su tapa de acero inoxidable se convierte en mate,
  brindando una experiencia práctica y funcional.


  Gracias a su excelente capacidad térmica, mantiene el agua caliente o fría
  durante horas, acompañándote durante toda la jornada.


  Con la calidad, resistencia y durabilidad que caracterizan a Stanley, es una
  opción ideal para quienes buscan comodidad, practicidad y un producto pensado
  para el uso diario.


  Stanley Mate System Classic 1,2 L: preparado para acompañarte en cada mate.
