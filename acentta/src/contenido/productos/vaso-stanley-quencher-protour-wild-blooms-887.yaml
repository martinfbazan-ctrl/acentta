descripcion: >-
  Disfrutá tus bebidas frías de forma práctica y segura con el Stanley Quencher
  con tapa ProTour.


  Su innovadora tapa permite levantar el sorbete para beber y cerrarlo
  fácilmente cuando terminás, ayudando a evitar derrames y pérdidas, ya sea que
  lo lleves en la mochila, el bolso o en el auto.


  Su aislamiento al vacío de doble pared mantiene tus bebidas frías hasta 9
  horas, y con hielo puede conservarlas frías por hasta 40 horas.


  Además, su diseño está pensado para adaptarse a la mayoría de los portavasos,
  convirtiéndolo en el compañero ideal para el trabajo, el gimnasio, los viajes
  o el día a día.


  Stanley Quencher ProTour: comodidad, rendimiento y frío durante horas.
